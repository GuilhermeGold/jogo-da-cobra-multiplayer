<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Battle Royale</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="mode-select-screen" class="overlay">
    <div class="panel">
      <h1>🐍 Snake Battle Royale</h1>
      <p>Como você quer jogar?</p>
      <div class="mode-choice-buttons">
        <button id="choose-multiplayer-btn" type="button" class="choice-btn">
          <span class="choice-icon">🏟️</span>
          <span class="choice-title">Multiplayer</span>
          <span class="choice-desc">Batalha real contra outros jogadores</span>
        </button>
        <button id="choose-challenge-btn" type="button" class="choice-btn">
          <span class="choice-icon">🎯</span>
          <span class="choice-title">Desafio</span>
          <span class="choice-desc">Missões solo contra o relógio</span>
        </button>
      </div>
    </div>
  </div>

  <div id="join-screen" class="overlay hidden">
    <div class="panel">
      <h1>🐍 Snake Battle Royale</h1>
      <p>Digite seu apelido e entre na arena. Último vivo vence!</p>
      <form id="join-form">
        <input id="nickname-input" type="text" maxlength="16" placeholder="Seu apelido" autocomplete="off" required />
        <button type="submit">Entrar</button>
      </form>
      <p id="join-error" class="error"></p>
      <button id="back-from-join-btn" type="button" class="link-btn">&larr; Voltar</button>
    </div>
  </div>

  <div id="challenge-menu-screen" class="overlay hidden">
    <div class="panel challenge-menu-panel">
      <h1>🎯 Escolha um desafio</h1>
      <div id="challenge-list"></div>
      <button id="back-from-challenge-menu-btn" type="button" class="link-btn">&larr; Voltar</button>
    </div>
  </div>

  <div id="challenge-screen" class="hidden">
    <div id="challenge-hud">
      <div id="challenge-title"></div>
      <div id="challenge-progress"></div>
      <div id="challenge-timer"></div>
      <button id="challenge-quit-btn" type="button" class="quit-btn">&times; Sair</button>
    </div>
    <div id="challenge-canvas-wrap">
      <canvas id="challenge-canvas"></canvas>
      <div id="challenge-result-overlay" class="overlay hidden">
        <div class="panel">
          <h2 id="challenge-result-title"></h2>
          <p id="challenge-result-detail"></p>
          <div class="challenge-result-buttons">
            <button id="challenge-retry-btn" type="button">Tentar novamente</button>
            <button id="challenge-menu-return-btn" type="button" class="secondary-btn">Escolher outro desafio</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="game-screen" class="hidden">
    <div id="hud">
      <div id="scoreboard"></div>
      <div id="round-info">
        <div id="mode-indicator"></div>
        <div id="round-message"></div>
        <div id="host-controls" class="hidden">
          <div id="mode-selector">
            <button id="mode-classic-btn" class="mode-btn" type="button">Clássico</button>
            <button id="mode-survival-btn" class="mode-btn" type="button">Sobrevivência</button>
          </div>
          <button id="start-btn" type="button">Iniciar partida</button>
        </div>
      </div>
    </div>
    <canvas id="game-canvas"></canvas>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
  <script src="challenge.js"></script>
</body>
</html>
